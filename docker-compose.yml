services:
  db:
    image: postgres:18.6
    container_name: clinica-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: clinica_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: clinica-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinica.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg_data: